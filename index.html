<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>HitungUsaha</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="appbar">
    <div class="brand">
      <span class="brand-mark">H</span>
      <div>
        <strong id="bizName">HitungUsaha</strong>
        <small id="pageTitle">Beranda</small>
      </div>
    </div>
    <button id="btnQuick" class="btn primary small" type="button">+ Catat</button>
  </header>

  <main id="view" class="view" tabindex="-1"></main>

  <nav class="tabbar" id="tabbar" aria-label="Menu utama">
    <a href="#/beranda" data-tab="beranda">Beranda</a>
    <a href="#/transaksi" data-tab="transaksi">Transaksi</a>
    <a href="#/produk" data-tab="produk">Produk</a>
    <a href="#/hutang" data-tab="hutang">Piutang</a>
    <a href="#/kalkulator" data-tab="kalkulator">Hitung</a>
    <a href="#/laporan" data-tab="laporan">Laporan</a>
    <a href="#/pengaturan" data-tab="pengaturan">Atur</a>
  </nav>

  <div id="modal" class="modal" hidden>
    <div class="sheet" role="dialog" aria-modal="true">
      <div class="sheet-head">
        <h2 id="modalTitle"></h2>
        <button id="modalClose" class="btn small" type="button">Tutup</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

  <div id="toast" class="toast" hidden></div>

  <script src="app.js"></script>
</body>
</html>
